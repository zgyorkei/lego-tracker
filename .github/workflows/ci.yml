name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # NOTE: `npm run format:check` is intentionally not gated yet. Enable it
      # after a one-time `npm run format` pass formats the legacy files, so this
      # workflow doesn't fail on pre-existing formatting.

      - name: Build
        run: npm run build
