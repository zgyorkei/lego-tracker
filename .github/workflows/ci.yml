name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # desktop/ is its own npm package (Electron, Playwright), so the root
      # install does not reach it. Typechecking needs neither binary: Electron
      # and Playwright download nothing at install today, and these flags keep
      # it that way if a version starts to. Its tsc and @types/node come from
      # the root install above.
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck desktop
        run: npm --prefix desktop run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      # CI has no Firebase project; the build only has to compile. Real
      # deployments must not set this (vite.config.ts).
      - name: Build
        run: npm run build
        env:
          ALLOW_MISSING_FIREBASE_CONFIG: '1'
